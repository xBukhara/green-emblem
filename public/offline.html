<!doctype html>
<html lang="en">
<head>

  <title>Offline · Green Emblem</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100dvh;

  </style>

<body>
  <img src="/icons/icon-192.png" alt="" />
